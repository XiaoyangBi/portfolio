# [INPUT]: 依赖 frontend/package-lock.json 与 frontend/package.json 的 build 脚本
# [OUTPUT]: 构建 frontend/dist 并发布到 GitHub Pages
# [POS]: 仓库的正式发布通道。push 到 main/master 即上线，链接固定、不带访问参数、不过期。
#        用户站点（<owner>.github.io）用根路径；项目站点自动设 BASE_PATH=/<仓库名>/。
#        dist/404.html 由 postbuild 生成，供 Pages 处理 /projects/:slug 这类深链。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Deploy Portfolio to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$repo_lc" = "$owner_lc.github.io" ]; then
            npm run build
          else
            BASE_PATH="/$REPO/" npm run build
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
